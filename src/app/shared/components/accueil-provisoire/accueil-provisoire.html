<section class="conteneur-page etroit">
  <app-entete-page
    [titre]="titre()"
    sousTitre="Cet espace sera bientôt disponible."
    icone="dashboard"
  />

  <div class="grille">
    <app-carte-info icone="account_circle" libelle="Compte">{{ auth.nomAffiche() }}</app-carte-info>
    @if (auth.role(); as role) {
      <app-carte-info icone="badge" libelle="Rôle">{{ libellesRole[role] }}</app-carte-info>
    }
  </div>

  <div class="actions">
    <button mat-stroked-button type="button" (click)="auth.deconnexion()">
      <mat-icon fontIcon="logout" aria-hidden="true" />Se déconnecter
    </button>
  </div>
</section>
