<section class="conteneur-page">
  <app-entete-page
    titre="Mes demandes"
    sousTitre="De la plus récente à la plus ancienne."
    icone="list_alt"
  >
    <a mat-flat-button routerLink="/patient/nouvelle-demande">
      <mat-icon fontIcon="add" aria-hidden="true" />Nouvelle demande
    </a>
  </app-entete-page>

  @if (information(); as info) {
    <app-encadre type="succes" role="status" class="encadre-haut">
      <p>{{ info }}</p>
    </app-encadre>
  }

  <div class="zone-progression">
    @if (enCours()) {
      <mat-progress-bar mode="indeterminate" aria-label="Chargement de vos demandes" />
    }
  </div>

  @if (erreur(); as message) {
    <app-encadre type="erreur" role="alert" class="encadre-haut">
      <p>{{ message }}</p>
      <button mat-stroked-button type="button" class="reessayer" (click)="charger()">
        <mat-icon fontIcon="refresh" aria-hidden="true" />Réessayer
      </button>
    </app-encadre>
  } @else if (enCours() && !elements().length) {
    <p class="texte-aide chargement-texte">Chargement de vos demandes…</p>
  } @else if (!total()) {
    <app-etat-vide
      icone="inbox"
      titre="Vous n'avez aucune demande."
      texte="Faites une première demande de consultation, pour vous ou pour un proche."
    >
      <a mat-flat-button routerLink="/patient/nouvelle-demande">
        <mat-icon fontIcon="note_add" aria-hidden="true" />Faire une demande
      </a>
    </app-etat-vide>
  } @else {
    <app-tableau-demandes
      [elements]="elements()"
      [total]="total()"
      [page]="page()"
      [taille]="taille()"
      [enCours]="enCours()"
      legende="Vos demandes de consultation, de la plus récente à la plus ancienne."
      libellePagination="Pagination de vos demandes"
      (ouvrir)="ouvrir($event)"
      (changerPage)="changerPage($event)"
    />
  }
</section>
